name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/qing329191254/lensmith-api
  IMAGE_WEB: ghcr.io/qing329191254/lensmith-web

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ${{ env.IMAGE_API }}:latest
            ${{ env.IMAGE_API }}:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./client/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_WEB }}:latest
            ${{ env.IMAGE_WEB }}:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Pull, migrate, and restart
        working-directory: /opt/lensmith
        run: |
          set -e
          # Compose/workflow files live on the host clone; images alone are not enough
          git fetch origin main
          git reset --hard origin/main
          if [ ! -f .env ]; then
            echo "Missing /opt/lensmith/.env — create it with DATABASE_URL and JWT_SECRET"
            exit 1
          fi
          if ! grep -q '^DATABASE_URL=.\+' .env; then
            echo "DATABASE_URL is missing or empty in /opt/lensmith/.env"
            exit 1
          fi
          # Ensure the Actions runner user can read .env (common Baota root-only permission issue)
          if [ ! -r .env ]; then
            echo "Cannot read /opt/lensmith/.env — run: sudo chmod 644 /opt/lensmith/.env"
            exit 1
          fi
          docker compose pull
          docker compose up -d --remove-orphans --force-recreate
          docker compose exec -T api python scripts/ensure_db.py
          docker compose exec -T api alembic upgrade head
          docker image prune -f
