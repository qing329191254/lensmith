services:
  api:
    image: ghcr.io/qing329191254/lensmith-api:latest
    build:
      context: ./server
    restart: unless-stopped
    # Host /opt/lensmith/.env (must be readable by the user running compose)
    env_file:
      - .env
    environment:
      # Optional server-side fallback keys. Browser BYO keys via headers still work.
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
      TEXT_API_KEY: ${TEXT_API_KEY:-}
      FAL_KEY: ${FAL_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      # Require these from host .env (compose interpolation); do not default to empty
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in /opt/lensmith/.env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in /opt/lensmith/.env}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-10080}
    volumes:
      - ./data/uploads:/app/uploads
    # Baota MySQL usually listens on host 127.0.0.1 only. Bridge + host.docker.internal
    # fails in that case; host network lets DATABASE_URL keep @127.0.0.1:3306.
    # Note: binds host :8000 — keep it firewalled from the public internet.
    network_mode: host

  web:
    image: ghcr.io/qing329191254/lensmith-web:latest
    build:
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    # Same host network as api so nginx can proxy_pass http://127.0.0.1:8000.
    # (Bridge + host-gateway often hangs on Baota/VPS iptables — /api never responds.)
    # nginx listens on 127.0.0.1:8080 (see deploy/nginx.conf); Baota → that address.
    network_mode: host
